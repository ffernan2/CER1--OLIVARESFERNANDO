<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/estilos.css">

    <title> Inscripción a Actividades</title>
</head>
<body>
    <section>
        <h3>Inscripcion a actividades</h3>

        <form action="#">
            <!--Pedir nombre-->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo: </label>
                <input type="text" class="form-control" id="nombre" required>
            </div>

            <!--Pedir correo-->
            <div class="mb-3">
                <label for="correo" class="form-label">E-Mail: </label>
                <input type="text" class="form-control" id="correo" required>
            </div>

            <!--Pedir Telefono-->
            <div class="mb-3">
                <label for="telefono" class="form-label">Numero Telefonico: </label>
                <input type="text" class="form-control" id="telefono" required>
            </div>

            <!--Pedir Actividad de interes-->
            <div class="mb-3">
                <label for="actividad" class="form-label">Actividad de interes: </label>
                <select class="form-select" id="actividad" required>
                    <option value="" >Escoja una opcion:</option>
                    <option value="" >Taller de cueca </option>
                    <option value="" >Taller de greda </option>
                    <option value="" >Exposicion de pinturas chilenas </option>
                    <option value="" >Feria de emprendedores </option>
                    <option value="" >Taller de mosaico </option>
                    <option value="" >Charla sobre IA </option>
                    <option value="" >Feria del libro </option>
                    <option value="" >Festival de Musica </option>
                </select>
            </div>

            <!--Pedir Edad-->
            <div class="mb-3">
                <label for="edad" class="form-label">Edad: </label>
                <input type="text" class="form-control" id="edad" required>
            </div>

            <!--Pedir Comentarios adicionales-->
            <div class="mb-3">
                <label for="correo" class="form-label">Comentarios adicionales: </label>
                <textarea type="text" class="form-control" id="correo"></textarea>
            </div>

            <!--Aceptar Terminos y condiciones-->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terminos" required>
                <label for="condiciones" class="form-check-label">Acepto los Terminos y condiciones</label>
            </div>

            <!--Boton-->
            <button type="enviar" class="btn btn-primary">Enviar Inscripcion</button>

            
        </form>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
